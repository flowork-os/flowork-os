<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Subtle Cyber Grid Lines -->
  <path d="M20 64 H108 M64 20 V108" stroke="#1f2d47" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1f2d47" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Cyber Shield Silhouette -->
  <path d="M64 26 L94 38 V64 C94 82 81 97 64 104 C47 97 34 82 34 64 V38 Z" fill="none" stroke="url(#neonGlow)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Cyber Core Shield -->
  <path d="M64 34 L86 44 V64 C86 77 76 89 64 95 C52 89 42 77 42 64 V44 Z" fill="url(#shieldGrad)" opacity="0.18"/>

  <!-- Terminal Hacker Prompt Symbol '>_' in Center -->
  <path d="M52 54 L61 63 L52 72" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="66" y1="72" x2="77" y2="72" stroke="#00ffcc" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Top Status Radar Dot -->
  <circle cx="64" cy="46" r="3" fill="#00ffcc" filter="url(#glow)"/>
</svg>
