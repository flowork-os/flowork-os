# Flowork OS Network & Dead Socket Shield
# Automatically detects and purges severed TCP connections within 90 seconds
# Prevents indefinite TCP half-open hangs (futex_do_wait) when upstream AI endpoints restart.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 3
