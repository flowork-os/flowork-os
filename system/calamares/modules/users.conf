# =============================================================================
# 🚀 Flowork Sovereign OS — Calamares Users Module Configuration
# =============================================================================
---
doAutologin: true
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - sudo
    - audio
    - video
    - plugdev
    - netdev
    - input
    - kvm
    - adm
    - systemd-journal
    - render
passwordRequirements:
    minLength: 1
    maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [ root ]
