# =============================================================================
# 🚀 Flowork Sovereign OS — Calamares DisplayManager Module Configuration
# Configures LightDM to default to Flowork Sovereign Desktop Session
# =============================================================================
---
displaymanagers:
  - lightdm

defaultDesktopEnvironment:
    executable: "cinnamon-session"
    desktopFile: "flowork"

basicSetup: false
sysconfigSetup: false
