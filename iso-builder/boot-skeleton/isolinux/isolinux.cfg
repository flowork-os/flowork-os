UI vesamenu.c32
PROMPT 0
TIMEOUT 100

MENU TITLE Flowork OS 7.3.0 (Rust Kernel) Boot Menu
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ff66 #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL live
    MENU LABEL ^Flowork OS 7.3.0 (Rust Kernel) - Live Session
    MENU DEFAULT
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components nofstab username=flowork hostname=flowork-os quiet splash

LABEL safe
    MENU LABEL Flowork OS 7.3.0 - Safe Graphics (nomodeset)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components nofstab username=flowork hostname=flowork-os nomodeset quiet splash

LABEL install
    MENU LABEL Install Flowork OS (Calamares Installer)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components nofstab username=flowork hostname=flowork-os calamares quiet splash
