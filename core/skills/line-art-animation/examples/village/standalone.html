<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Village · Flowork OS 2D Animation</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ebe8e2; }
  body { display: grid; place-items: center; }
  .card { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #fdfdfc; }
  #village, #village svg { display: block; width: 100%; height: 100%; }
  #village svg .pp { fill: var(--paper, #fdfdfc); }
  .hud { position: absolute; left: 2.2%; top: 3.4%; font: 500 24px/1.3 "Iowan Old Style", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif; color: #1c1c1c; letter-spacing: .04em; pointer-events: none; opacity: .85; }
  .hud b { font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  .hud span { margin-left: 6px; font-size: .9em; }
  #hint { display: none; }
</style>
</head>
<body class="capture">
  <div class="card" id="card">
    <div id="village"></div>
    <div class="hud" id="clock"></div>
    <p id="hint"></p>
  </div>
  <script type="module" src="./village_bundle.js"></script>
</body>
</html>
