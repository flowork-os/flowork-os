# =============================================================================
# Flowork Sovereign OS — Lightweight Software Compositor Profile (picom-software)
# Fallback profile when session WM started with --compositor=off on llvmpipe.
# Eliminates CPU-intensive full-screen alpha blending, shadows, and fades.
# =============================================================================

backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = true;

# Keep windows opaque by default so Xorg avoids blending full 2560x1080 repaints;
# apps with native RGBA visuals (Alacritty, Plank, mrflow-sidebar) stay transparent.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

shadow = false;
fading = false;

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 0.96; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
