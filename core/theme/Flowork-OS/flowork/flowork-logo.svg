<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="floworkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Hex Shield -->
  <polygon points="256,24 456,136 456,376 256,488 56,376 56,136" 
           fill="#08090d" 
           stroke="url(#floworkGlow)" 
           stroke-width="16" 
           stroke-linejoin="round"/>

  <!-- Inner Cybernetic Circuit Hexagon -->
  <polygon points="256,54 426,150 426,362 256,458 86,362 86,150" 
           fill="#0c0e14" 
           stroke="rgba(0, 243, 255, 0.25)" 
           stroke-width="4" 
           stroke-linejoin="round"/>

  <!-- Flowork Emblem: Sovereign 'F' Pulse Engine -->
  <g filter="url(#neonBlur)">
    <!-- Main Vertical Core Pillar -->
    <path d="M 170 140 L 230 140 L 230 380 L 170 380 Z" fill="url(#floworkGlow)"/>

    <!-- Top Horizontal Quantum Bar -->
    <path d="M 230 140 L 360 140 L 360 195 L 230 195 Z" fill="url(#floworkGlow)"/>

    <!-- Mid Quantum Accelerator Bar with Node -->
    <path d="M 230 240 L 325 240 L 325 295 L 230 295 Z" fill="url(#floworkGlow)"/>

    <!-- Flow Energy Orbital Points -->
    <circle cx="360" cy="167" r="14" fill="#00f3ff"/>
    <circle cx="325" cy="267" r="12" fill="#7928ca"/>
    <circle cx="200" cy="380" r="10" fill="#00f3ff"/>
  </g>
</svg>
