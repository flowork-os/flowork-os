<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e112a"/>
      <stop offset="50%" stop-color="#0f0918"/>
      <stop offset="100%" stop-color="#07040a"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" stroke="#381d54" stroke-width="6"/>

  <!-- Glowing Creative Aperture / Studio Iris -->
  <g filter="url(#glow)">
    <!-- Outer Ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#prismGrad)" stroke-width="12" stroke-dasharray="14 8"/>
    
    <!-- Central Prism Diamond -->
    <path d="M 256,128 L 360,256 L 256,384 L 152,256 Z" fill="none" stroke="url(#accentGrad)" stroke-width="10"/>

    <!-- Media Play & Waveform Elements -->
    <polygon points="240,210 240,302 310,256" fill="url(#prismGrad)"/>
    
    <!-- Equalizer bars bottom -->
    <rect x="180" y="330" width="12" height="26" rx="6" fill="#00f2fe"/>
    <rect x="204" y="316" width="12" height="40" rx="6" fill="#7928ca"/>
    <rect x="228" y="306" width="12" height="50" rx="6" fill="#ff007a"/>
    <rect x="252" y="322" width="12" height="34" rx="6" fill="#00f2fe"/>
    <rect x="276" y="300" width="12" height="56" rx="6" fill="#ff007a"/>
    <rect x="300" y="318" width="12" height="38" rx="6" fill="#7928ca"/>
    <rect x="324" y="332" width="12" height="24" rx="6" fill="#00f2fe"/>
  </g>

  <!-- Top Crown Jewel / Lens Flare -->
  <circle cx="256" cy="128" r="14" fill="#00f2fe"/>
  <circle cx="256" cy="128" r="7" fill="#ffffff"/>
</svg>
