  </defs>
  <rect x="28" y="28" width="200" height="200" rx="54" fill="url(#camGlass)" stroke="rgba(255, 255, 255, 0.70)" stroke-width="2.5"/>
  <line x1="56" y1="30" x2="200" y2="30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
