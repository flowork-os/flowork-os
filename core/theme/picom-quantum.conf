# --- Backend Engine (High performance, Zero GPU Shader overhead) ---
backend = "xrender";
vsync = true;
use-damage = true;

# --- Window Opacity & Translucency Matrix ---
inactive-opacity = 0.78;
active-opacity = 0.84;
frame-opacity = 0.88;
inactive-opacity-override = false;

opacity-rule = [
  "80:class_g = 'cinnamon-settings.py'",
  "80:class_g = 'Cinnamon-settings.py'",
  "80:class_g = 'Xfce4-settings-manager'",
  "80:class_g = 'nemo'",
  "80:class_g = 'Nemo'",
  "75:class_g = 'Alacritty'",
  "75:class_g = 'Xfce4-terminal'",
  "85:class_g = 'antigravity'",
  "85:class_g = 'code'",
  "98:class_g = 'Google-chrome'",
  "98:class_g = 'google-chrome'",
  "78:class_g = 'Flowork-Quantum-Rail'",
  "86:class_g = 'Flowork-Orbit'"
];

# --- Shadows & Edges ---
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.55;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#001b2b";

shadow-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Plank'",
  "class_g = 'plank'"
];

# --- Fluid Fade Physics ---
fading = true;
fade-in-step = 0.10;
fade-out-step = 0.10;
fade-delta = 10;
fade-exclude = [];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.90; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.90; shadow = true; };
  dropdown_menu = { opacity = 0.90; shadow = true; };
};
