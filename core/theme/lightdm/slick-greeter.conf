# ==============================================================================
# FLOWORK OS - SLICK GREETER CONFIGURATION
# Territory: /opt/floworkos
# Sovereign Display Manager Branding & Theming
# ==============================================================================

[Greeter]
background=/usr/share/backgrounds/flowork/wallpaper-flowork.png
background-color=#08090d
draw-grid=false
draw-user-backgrounds=false
show-hostname=true
show-keyboard=true
show-a11y=true
show-power=true
show-clock=true
show-quit=true
logo=/usr/share/slick-greeter/badges/flowork-logo.png
other-monitors-logo=/usr/share/slick-greeter/badges/flowork-logo.png
theme-name=Mint-Y-Dark-Aqua
icon-theme-name=Flowork-OS
font-name=Cantarell 11
xft-antialias=true
xft-hintstyle=hintfull
xft-rgba=rgb
enable-hidpi=auto
