[package]
name = "flowork-openscreen"
version = "2.2.2"
edition = "2021"
authors = ["Flowork OS Sovereign Team <core@floworkos.com>"]
description = "Sovereign Native OpenScreen with Auto-Zoom Telemetry for Flowork OS"
license = "MIT"

[dependencies]
wry = { version = "0.49", features = ["protocol"] }
tao = "0.30"
gtk = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = "0.4"
dirs = "5.0"
mime_guess = "2.0"
