[package]
name = "flowork-core-rs"
version = "2.0.0"
edition = "2021"
description = "Flowork Sovereign Core — Native Rust System Daemons, Lifecycle Engine, CDP MCP & Tool Runners"
license = "MIT"

[lib]
name = "flowork_core_rs"
path = "src/lib.rs"

[[bin]]
name = "flowork-neural-bus"
path = "src/bin/flowork-neural-bus.rs"

[[bin]]
name = "flowork-edits-daemon"
path = "src/bin/flowork-edits-daemon.rs"

[[bin]]
name = "flowork-lint-skills"
path = "src/bin/flowork-lint-skills.rs"

[[bin]]
name = "flowork-tool-discovery"
path = "src/bin/flowork-tool-discovery.rs"

[[bin]]
name = "flowork-tool-executor"
path = "src/bin/flowork-tool-executor.rs"

[[bin]]
name = "flowork-browser-mcp"
path = "src/bin/flowork-browser-mcp.rs"

[[bin]]
name = "flowork-tool-runner"
path = "src/bin/flowork-tool-runner.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
bytes = "1.7"
urlencoding = "2.1"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"
http-range-header = "0.4"
libc = "0.2"
base64 = "0.22"
glob = "0.3"
ignore = "0.4"

