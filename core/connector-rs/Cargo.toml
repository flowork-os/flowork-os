[package]
name = "flowork-connector"
version = "2.18.0"
edition = "2021"
description = "Flowork Sovereign Connector — Pure Rust Multi-Account AI Gateway & Quota Rotator"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
futures-util = "0.3"
bytes = "1.7"
urlencoding = "2.1"
dirs = "5.0"
regex = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
