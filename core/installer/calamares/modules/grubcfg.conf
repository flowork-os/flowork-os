# =============================================================================
# 🚀 Flowork Sovereign OS — Calamares GRUBCfg Module Configuration
# Configures GRUB with professional silent animated boot and shutdown splash
# =============================================================================
---
overwrite: false
keep_distributor: false
kernel_params: [ "quiet", "splash", "loglevel=3", "systemd.show_status=auto", "rd.udev.log_level=3", "vt.global_cursor_default=0" ]
defaults:
    GRUB_TIMEOUT: 2
    GRUB_DEFAULT: "0"
    GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0"
    GRUB_ENABLE_CRYPTODISK: true
