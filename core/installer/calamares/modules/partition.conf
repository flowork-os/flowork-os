# =============================================================================
# 👑 FLOWORK OS — CALAMARES PARTITION MODULE CONFIGURATION
# Default: Automated Btrfs Subvolume Layout with CoW Time-Lock Protection
# =============================================================================
---
efiSystemPartition: "/boot/efi"
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
userSwapChoices:
    - none
    - file
initialSwapChoice: none
drawNestedPartitions: true
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4"]
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /run/systemd/resolve
      mountPoint: /run/systemd/resolve
      options: [ bind ]
