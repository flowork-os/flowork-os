# =============================================================================
# 🚀 Flowork Sovereign OS — Calamares Partition Module Configuration
# Universal Linux FHS Standard | 100% User Agnostic
# =============================================================================
---
# EFI System Partition Configuration (2048 MiB recommended for kernel & initramfs headroom)
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 2048MiB
    minimumSize: 1024MiB
    label: "EFI"

# Backward-compatible EFI aliases
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 2048MiB
efiSystemPartitionName: "EFI"

enableLuksAutomatedPartitioning: true
luksGeneration: luks2

userSwapChoices:
    - none
    - file
initialSwapChoice: none

drawNestedPartitions: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs"]

# Automated Erase Disk Partition Layout
partitionLayout:
    - name: "rootfs"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
      minSize: 15GiB
