# =============================================================================
# 👑 FLOWORK OS — CALAMARES MOUNT MODULE & BTRFS SUBVOLUMES
# Sets up @root, @home, @snapshots, and @var_log for Pilar 4 Time-Lock
# =============================================================================
---
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@var_log

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: btrfs
      options: [ defaults, noatime, autodefrag, compress=zstd:1 ]
      ssdOptions: [ discard=async ]
    - filesystem: ext4
      ssdOptions: [ discard ]
    - filesystem: swap
      ssdOptions: [ discard ]
