# =============================================================================
# 👑 FLOWORK OS — CALAMARES SOVEREIGN SYSTEM INSTALLER SETTINGS
# Universal Bare-Metal Installer with Automated Btrfs Subvolume Layout
# =============================================================================
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: flowork
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
