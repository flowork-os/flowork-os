set default=0
set timeout=10

insmod font
insmod all_video
insmod gfxterm
insmod png

terminal_output gfxterm

# Locate the root filesystem partition containing /live/vmlinuz
search --no-floppy --set=root --file /live/vmlinuz

menuentry "👑 Flowork OS 7.3.0 (Rust Kernel) - Live Session" --class flowork --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components nofstab username=flowork hostname=flowork-os quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 ---
    initrd /live/initrd.img
}

menuentry "👑 Flowork OS 7.3.0 (Safe Graphics - nomodeset)" --class flowork --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components nofstab username=flowork hostname=flowork-os nomodeset quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 ---
    initrd /live/initrd.img
}

menuentry "🚀 Install Flowork OS 1.0 (Calamares GUI Installer)" --class flowork --class gnu-linux --class gnu --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live components nofstab username=flowork hostname=flowork-os calamares quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0 ---
    initrd /live/initrd.img
}
