<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowRepo — Sovereign GitHub Vault & Time Machine</title>
  <style>
    :root {
      --bg-obsidian: rgba(8, 12, 16, 0.96);
      --card-bg: rgba(16, 22, 32, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(0, 242, 254, 0.4);
      --accent-green: #00ff66;
      --accent-cyan: #00f2fe;
      --accent-gold: #ffd700;
      --accent-purple: #b388ff;
      --accent-red: #ff3366;
      --text-main: #f0f4fc;
      --text-muted: #8b9bb4;
      --font-mono: "JetBrains Mono", "Fira Code", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-obsidian);
      color: var(--text-main);
      font-family: var(--font-sans);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 12px;
      backdrop-filter: blur(28px);
    }

    /* Sovereign Titlebar */
    .titlebar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(10, 14, 22, 0.92);
      border-bottom: 1px solid var(--card-border);
      -webkit-app-region: drag;
    }

    .titlebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
    }

    .vault-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-family: var(--font-mono);
      background: rgba(0, 255, 102, 0.10);
      color: var(--accent-green);
      border: 1px solid rgba(0, 255, 102, 0.3);
    }

    .vault-status-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .titlebar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .btn-win {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-win:hover { transform: scale(1.15); }
    .btn-win.close { background: #ff5f56; }
    .btn-win.min { background: #ffbd2e; }
    .btn-win.max { background: #27c93f; }

    /* Layout */
    .app-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 18px;
      gap: 12px;
      overflow: hidden;
    }

    /* Header Controls */
    .header-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .search-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-input-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-box .icon-search {
      position: absolute;
      left: 14px;
      color: var(--accent-cyan);
      font-size: 13px;
      pointer-events: none;
    }

    .search-input-box input {
      width: 100%;
      height: 38px;
      padding-left: 36px;
      padding-right: 36px;
      background: rgba(0, 0, 0, 0.50);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input-box input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      width: 20px;
      height: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 10px;
      font-family: var(--font-mono);
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    .clear-search-btn:hover {
      background: rgba(255, 51, 102, 0.35);
      border-color: var(--accent-red);
      color: #fff;
      transform: scale(1.1);
    }

    /* Sort controls */
    .sort-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .pill-btn {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-family: var(--font-mono);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.10);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .pill-btn.active {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: 700;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    }

    .pill-btn.sync-btn {
      background: rgba(0, 255, 102, 0.08);
      border-color: rgba(0, 255, 102, 0.3);
      color: var(--accent-green);
    }

    .pill-btn.sync-btn:hover {
      background: rgba(0, 255, 102, 0.2);
      border-color: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
    }

    /* Time Machine Filters */
    .timeline-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .timeline-bar::-webkit-scrollbar {
      height: 4px;
    }
    .timeline-bar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .time-btn {
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 5px;
      color: var(--text-muted);
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .time-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .time-btn.active {
      background: rgba(255, 215, 0, 0.15);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      font-weight: 700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    /* Repository Cards Grid */
    .repo-viewport {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
      padding-right: 4px;
      align-content: start;
    }

    .repo-viewport::-webkit-scrollbar {
      width: 6px;
    }
    .repo-viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .repo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
      position: relative;
    }

    .repo-card:hover {
      transform: translateY(-2px);
      border-color: var(--card-hover-border);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    .repo-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .repo-title {
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: #fff;
      word-break: break-all;
    }

    .repo-author {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .stars-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      background: rgba(255, 215, 0, 0.12);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 4px;
      color: var(--accent-gold);
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .repo-desc {
      font-size: 12px;
      line-height: 1.45;
      color: #c0cbe0;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .repo-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .repo-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 10.5px;
    }

    .repo-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action {
      padding: 4px 9px;
      border-radius: 5px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      cursor: pointer;
      font-size: 11px;
      font-family: var(--font-mono);
      transition: all 0.15s;
    }

    .btn-action:hover {
      background: rgba(0, 242, 254, 0.18);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Bottom Pagination Bar */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(10, 14, 22, 0.90);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .page-numbers {
      display: flex;
      gap: 4px;
    }

    .page-btn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 5px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .page-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .page-btn.active {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: 700;
    }

    /* Empty state card */
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      gap: 16px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .empty-state-title {
      font-size: 15px;
      color: #fff;
      font-weight: 700;
    }

    .empty-state-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(0, 255, 102, 0.18);
      border: 1px solid var(--accent-green);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--font-mono);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s, opacity 0.25s;
      z-index: 999;
      box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Window Titlebar -->
  <div class="titlebar">
    <div class="titlebar-brand">
      <span>👑 FlowRepo</span>
      <span class="vault-status-badge" id="vault-badge"><span class="dot"></span> Local Vault (Instant)</span>
    </div>
    <div class="titlebar-actions">
      <button class="btn-win min" onclick="windowAction('minimize')" title="Minimize"></button>
      <button class="btn-win max" onclick="windowAction('maximize')" title="Maximize"></button>
      <button class="btn-win close" onclick="windowAction('close')" title="Close"></button>
    </div>
  </div>

  <div class="app-layout">
    <!-- Header Controls -->
    <div class="header-panel">
      <div class="search-row">
        <div class="search-input-box">
          <span class="icon-search">🔍</span>
          <input 
            type="text" 
            id="repo-search" 
            placeholder="Cari repositori (e.g. AI, Rust, Linux, React, Ollama, Python)..." 
            autocomplete="off" 
            oninput="handleSearchInput(event)"
            onkeydown="handleSearchKeyDown(event)"
          >
          <button class="clear-search-btn" id="btn-clear-search" onclick="clearSearch()" title="Batalkan / Hapus Pencarian">✕</button>
        </div>

        <div class="sort-box">
          <span>Urutkan:</span>
          <button class="pill-btn active" id="sort-stars" onclick="setSort('stars')">⭐ Stars</button>
          <button class="pill-btn" id="sort-updated" onclick="setSort('updated')">⚡ Recent</button>
          <button class="pill-btn" id="sort-forks" onclick="setSort('forks')">🍴 Forks</button>
          <button class="pill-btn sync-btn" id="btn-sync-live" onclick="syncLiveFromGithub()" title="Perbarui trending harian dari GitHub">🔄 Sync Live</button>
          <button class="pill-btn sync-btn" id="btn-harvest" onclick="triggerFullHarvest()" title="Scrape & arsipkan ribuan repositori trending sepanjang masa (2008-2026)">⚡ Scrape All</button>
        </div>
      </div>

      <!-- Time Machine Filters -->
      <div class="timeline-bar">
        <button class="time-btn active" id="time-all" onclick="setTimeFilter('all')">🏆 Sepanjang Masa (All Time)</button>
        <button class="time-btn" id="time-week" onclick="setTimeFilter('week')">⚡ Minggu Ini</button>
        <button class="time-btn" id="time-month" onclick="setTimeFilter('month')">📅 Bulan Ini</button>
        <button class="time-btn" id="time-year" onclick="setTimeFilter('year')">🚀 Tahun Ini</button>
        <button class="time-btn" id="time-2023_2026" onclick="setTimeFilter('2023_2026')">🤖 Era AI (2023-2026)</button>
        <button class="time-btn" id="time-2020_2022" onclick="setTimeFilter('2020_2022')">🧠 Era ML (2020-2022)</button>
        <button class="time-btn" id="time-2015_2019" onclick="setTimeFilter('2015_2019')">🌐 Web Modern (2015-2019)</button>
        <button class="time-btn" id="time-2008_2014" onclick="setTimeFilter('2008_2014')">⏳ Jaman Dulu (2008-2014)</button>
      </div>
    </div>

    <!-- Repository Cards Grid -->
    <div class="repo-viewport" id="repo-grid">
      <!-- Populated dynamically -->
    </div>

    <!-- Bottom Pagination -->
    <div class="pagination-bar">
      <div>
        <span id="page-summary">Memuat repositori dari local database...</span>
      </div>
      <div class="page-numbers" id="page-controls">
        <!-- Render page buttons -->
      </div>
    </div>
  </div>

  <div class="toast" id="toast-msg">Copied!</div>

  <script>
    let currentTimeFilter = "all";
    let currentSort = "stars";
    let currentPage = 1;
    let totalPages = 1;
    let searchDebounceTimer = null;
    let cachedDefaultRepos = null;

    // WebKit Bridge RPC
    function invokeBridge(action, payload = {}) {
      return new Promise((resolve) => {
        const reqId = "req_" + Math.random().toString(36).substr(2, 9);
        window["_flowork_cb_" + reqId] = (response) => {
          delete window["_flowork_cb_" + reqId];
          resolve(response);
        };
        try {
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.floworkBridge) {
            window.webkit.messageHandlers.floworkBridge.postMessage(JSON.stringify({
              action: "execute",
              reqId: reqId,
              payload: { action: action, ...payload }
            }));
          } else {
            console.warn("WebKit bridge not available in browser mode");
            resolve({ status: "error", error: "No bridge" });
          }
        } catch (e) {
          console.error("Bridge dispatch failed:", e);
          resolve({ status: "error", error: String(e) });
        }
      });
    }

    function openExternalLink(url) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.floworkBridge) {
        window.webkit.messageHandlers.floworkBridge.postMessage(JSON.stringify({
          action: "open_url",
          payload: { url: url }
        }));
      } else {
        window.open(url, '_blank');
      }
    }

    function windowAction(act) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.floworkBridge) {
        window.webkit.messageHandlers.floworkBridge.postMessage(JSON.stringify({ action: act }));
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast-msg");
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function setTimeFilter(f) {
      currentTimeFilter = f;
      currentPage = 1;
      document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("time-" + f);
      if (btn) btn.classList.add("active");
      loadRepos();
    }

    function setSort(s) {
      currentSort = s;
      currentPage = 1;
      document.querySelectorAll(".pill-btn").forEach(b => {
        if (!b.classList.contains("sync-btn")) b.classList.remove("active");
      });
      const btn = document.getElementById("sort-" + s);
      if (btn) btn.classList.add("active");
      loadRepos();
    }

    function goToPage(p) {
      currentPage = p;
      loadRepos();
    }

    // Input event handler
    function handleSearchInput(e) {
      const val = e.target.value;
      const clearBtn = document.getElementById("btn-clear-search");
      if (val.length > 0) {
        clearBtn.style.display = "flex";
      } else {
        clearBtn.style.display = "none";
        // Search cleared/empty: restore default repos immediately!
        if (cachedDefaultRepos && cachedDefaultRepos.length > 0) {
          renderRepos(cachedDefaultRepos);
        }
      }

      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        currentPage = 1;
        loadRepos();
      }, 250);
    }

    // Keyboard event handler
    function handleSearchKeyDown(e) {
      if (e.key === "Escape") {
        clearSearch();
      }
    }

    // Clear search and restore list instantly
    function clearSearch() {
      const input = document.getElementById("repo-search");
      input.value = "";
      document.getElementById("btn-clear-search").style.display = "none";
      currentPage = 1;

      // Immediate restoration with 0ms latency from cache
      if (cachedDefaultRepos && cachedDefaultRepos.length > 0) {
        renderRepos(cachedDefaultRepos);
      }

      loadRepos();
      input.focus();
    }

    async function syncLiveFromGithub() {
      const syncBtn = document.getElementById("btn-sync-live");
      const originalText = syncBtn.innerHTML;
      syncBtn.innerHTML = "⏳ Syncing...";
      syncBtn.disabled = true;

      const query = document.getElementById("repo-search").value.trim();
      const res = await invokeBridge("sync_live", {
        time_filter: currentTimeFilter,
        sort_by: currentSort,
        page: currentPage,
        per_page: 25,
        query: query
      });

      syncBtn.innerHTML = originalText;
      syncBtn.disabled = false;

      if (res && res.status === "success") {
        showToast("✓ Repositori baru berhasil disinkronkan ke Local Vault!");
        loadRepos();
        updateStats();
      } else {
        showToast("⚠️ Menggunakan cache lokal (GitHub API Offline/Limited)");
      }
    }

    async function triggerFullHarvest() {
      const btn = document.getElementById("btn-harvest");
      const orig = btn.innerHTML;
      btn.innerHTML = "⏳ Harvesting (2008-2026)...";
      btn.disabled = true;
      showToast("🚀 Menjalankan scraper ribuan repositori trending sepanjang masa...");

      const res = await invokeBridge("run_scraper", { mode: "all" });
      btn.innerHTML = orig;
      btn.disabled = false;

      if (res && res.status === "success") {
        showToast(`🎉 Sukses! Total ${res.total_repositories.toLocaleString()} repositori tersimpan di vault.`);
        loadRepos();
        updateStats();
      } else {
        showToast("⚠️ Scraper selesai dengan peringatan.");
      }
    }

    async function updateStats() {
      const stats = await invokeBridge("stats", {});
      if (stats && stats.status === "success") {
        const badge = document.getElementById("vault-badge");
        if (badge) {
          badge.innerHTML = `<span class="dot"></span> Local Vault: ${stats.total_repositories} Repos`;
        }
      }
    }

    async function loadRepos() {
      const query = document.getElementById("repo-search").value.trim();
      const grid = document.getElementById("repo-grid");

      // Only show loading spinner if we don't have instant cached results
      if (!query && cachedDefaultRepos && cachedDefaultRepos.length > 0 && currentPage === 1) {
        // Fast path: cached view is already displayed
      } else {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-muted); font-size: 13px;">
            ⏳ Memuat repositori (Halaman ${currentPage})...
          </div>
        `;
      }

      const res = await invokeBridge("query", {
        time_filter: currentTimeFilter,
        sort_by: currentSort,
        page: currentPage,
        per_page: 25,
        query: query
      });

      if (res && res.status === "success") {
        totalPages = res.total_pages || 1;
        document.getElementById("page-summary").innerText = `Total: ${res.total_count.toLocaleString()} repos | Halaman ${currentPage} dari ${totalPages}`;
        
        // Cache initial page of all-time repos for instant cancellation restore
        if (!query && currentTimeFilter === "all" && currentPage === 1) {
          cachedDefaultRepos = res.repos || [];
        }

        renderRepos(res.repos || [], query);
        renderPagination(totalPages);
      } else {
        // If error occurred and query is empty, fallback to cachedDefaultRepos
        if (!query && cachedDefaultRepos && cachedDefaultRepos.length > 0) {
          renderRepos(cachedDefaultRepos, "");
        } else {
          renderRepos([], query);
        }
      }
    }

    function renderPagination(totalP) {
      const container = document.getElementById("page-controls");
      container.innerHTML = "";

      if (totalP <= 1) return;

      const maxButtons = 7;
      let startP = Math.max(1, currentPage - 3);
      let endP = Math.min(totalP, startP + maxButtons - 1);
      if (endP - startP < maxButtons - 1) {
        startP = Math.max(1, endP - maxButtons + 1);
      }

      // Prev Button
      if (currentPage > 1) {
        const prev = document.createElement("button");
        prev.className = "page-btn";
        prev.innerText = "◀";
        prev.onclick = () => goToPage(currentPage - 1);
        container.appendChild(prev);
      }

      for (let i = startP; i <= endP; i++) {
        const btn = document.createElement("button");
        btn.className = `page-btn ${i === currentPage ? "active" : ""}`;
        btn.innerText = i;
        btn.onclick = () => goToPage(i);
        container.appendChild(btn);
      }

      // Next Button
      if (currentPage < totalP) {
        const next = document.createElement("button");
        next.className = "page-btn";
        next.innerText = "▶";
        next.onclick = () => goToPage(currentPage + 1);
        container.appendChild(next);
      }
    }

    function copyClone(fullName) {
      const cmd = `git clone https://github.com/${fullName}.git`;
      navigator.clipboard.writeText(cmd);
      showToast(`Copied: ${cmd}`);
    }

    function renderRepos(repos, currentQuery = "") {
      const grid = document.getElementById("repo-grid");
      grid.innerHTML = "";

      if (!repos || repos.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 32px;">🔍</div>
            <div class="empty-state-title">Tidak ada repositori yang cocok ${currentQuery ? 'dengan "' + currentQuery + '"' : 'dengan filter ini'}</div>
            <div style="font-size: 12px; max-width: 420px; line-height: 1.5;">
              Repositori mungkin belum tersimpan di Local Vault, atau kata kunci terlalu spesifik.
            </div>
            <div class="empty-state-actions">
              <button class="pill-btn active" onclick="clearSearch()">✕ Hapus Pencarian & Tampilkan Semua</button>
              <button class="pill-btn sync-btn" onclick="syncLiveFromGithub()">🌐 Cari Online di GitHub</button>
            </div>
          </div>
        `;
        return;
      }

      repos.forEach(r => {
        const card = document.createElement("div");
        card.className = "repo-card";
        card.innerHTML = `
          <div class="repo-header">
            <div>
              <div class="repo-title">${r.name}</div>
              <div class="repo-author">${r.full_name}</div>
            </div>
            <div class="stars-badge">⭐ ${r.stars}</div>
          </div>
          <div class="repo-desc">${r.desc}</div>
          <div class="repo-footer">
            <div class="repo-meta">
              <span>🏷️ ${r.language || 'Code'}</span>
              <span>📅 ${r.created_at || 'Heritage'}</span>
            </div>
            <div class="repo-actions">
              <button class="btn-action" onclick="copyClone('${r.full_name}')" title="Copy git clone command">📋 Clone</button>
              <button class="btn-action" onclick="openExternalLink('${r.url}')" title="Open repository in GitHub">↗ GitHub</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadRepos();
      updateStats();
    });
  </script>
</body>
</html>
