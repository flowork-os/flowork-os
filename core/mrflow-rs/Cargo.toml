[package]
name = "mrflow"
version = "2.0.0"
edition = "2021"
description = "Mr. Flow — Clean-Room Native Rust Autonomous Agent Engine for Flowork OS"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
futures-util = "0.3"
bytes = "1.7"
ignore = "0.4"
glob = "0.3"
libc = "0.2"
dirs = "5.0"
portable-pty = "0.8"
ratatui = "0.29"
crossterm = "0.28"
base64 = "0.22"
urlencoding = "2.1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
